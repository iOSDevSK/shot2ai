<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shot2AI</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="popup">
  <header class="popup-head">
    <div class="brand"><span class="brand-symbol" data-icon="capture"></span><span>Shot<span class="two">2</span>AI</span></div>
    <div class="head-right"><span id="state" class="status" hidden></span><button id="options" class="icon-button" data-icon="gear" aria-label="Options" title="Options"></button></div>
  </header>

  <section id="dest" class="panel dest">
    <div class="dest-head"><label class="label" for="dest-select">Screenshots go to</label><span id="dest-state" class="status" hidden></span></div>
    <div class="select"><select id="dest-select" aria-describedby="dest-state dest-note"></select><span class="select-arrow" data-icon="chevron"></span></div>
    <p id="dest-note" class="notice warn" hidden></p>
    <button id="allow" class="button wide allow" hidden></button>
  </section>

  <section id="checking" class="panel center" hidden><span class="spinner spin" data-icon="spinner"></span><p>Looking for html2wp on this Mac…</p></section>

  <section id="offline" class="panel" hidden>
    <h1>html2wp is not running</h1>
    <p>Open the html2wp app on this Mac, then check again.</p>
    <button id="recheck" class="button" data-icon="retry">Check again</button>
  </section>

  <section id="pairing" class="panel" hidden>
    <h1>Pair with html2wp</h1>
    <p>In html2wp, open <b>Settings → Chrome extension</b> and enter the 6-digit code.</p>
    <form id="pair-form" class="pair-form">
      <input id="code" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000 000" aria-label="Pairing code">
      <button id="pair" class="button primary" type="submit">Pair</button>
    </form>
    <p id="pair-error" class="notice err" role="alert" hidden></p>
  </section>

  <section id="ready" class="panel" hidden>
    <div class="label">html2wp · open project</div>
    <div class="project"><strong id="project-name"></strong><span id="chat-state" class="status"></span></div>
    <p id="chat-reason" class="notice warn" hidden></p>
  </section>

  <footer class="popup-foot">
    <button id="capture" class="button primary wide" data-icon="capture">Capture area<kbd class="key" id="key-area" hidden></kbd></button>
    <button id="capture-full" class="button wide" data-icon="fullpage">Capture full page<kbd class="key" id="key-full" hidden></kbd></button>
    <button id="show-stack" class="button wide" hidden></button>
    <p id="capture-error" class="notice err" role="alert" hidden></p>
    <div class="hint"><span id="paste-hint"></span></div>
    <p class="publisher">Shot2AI by BELNEM s.r.o.</p>
    <div class="links"><span class="meta-links"><span id="version" class="version"></span> · <a href="https://html2wp.dev/" target="_blank" rel="noopener">html2wp.dev</a></span></div>
  </footer>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
